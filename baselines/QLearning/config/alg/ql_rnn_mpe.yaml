# valid for iql, vdn, qmix
"TOTAL_TIMESTEPS": 2e6
"NUM_ENVS": 8
"NUM_STEPS": 26
"BUFFER_SIZE": 5000
"BUFFER_BATCH_SIZE": 32
"HIDDEN_SIZE": 64
"AGENT_INIT_SCALE": 2.0

# NOTE: only used if load_path in config.yaml is set
"AGENT_HYPERNET_KWARGS":
  "HIDDEN_DIM": 32
  "INIT_SCALE": 0.2
  "NUM_LAYERS": 2
  "USE_LAYER_NORM": True

"EPS_START": 1.0
"EPS_FINISH": 0.05
"EPSILON_ANNEAL_TIME": 100000 # "EPS_DECAY": 0.1 # percentage of updates
"MIXER_EMBEDDING_DIM": 32 # just for qmix
"MIXER_HYPERNET_HIDDEN_DIM": 64 # just for qmix
"MIXER_INIT_SCALE": 0.00001 # just for qmix
"MAX_GRAD_NORM": 25
"TARGET_UPDATE_INTERVAL": 200
"TAU": 1.
"NUM_EPOCHS": 1 
"LR": 0.005
"RNN_LR": 5e-4
"LEARNING_STARTS": 10000 # timesteps
"LR_LINEAR_DECAY": True
"EPS_ADAM": 0.001
"WEIGHT_DECAY_ADAM": 0.00001
"TD_LAMBDA": 0.6
"GAMMA": 0.9

# ENV
"ENV_NAME": "MPE_simple_spread_v3"
"ENV_KWARGS": 
  "num_agents": 5
  "num_landmarks": 5
  # "num_agents": 1
  # "num_landmarks": 1

# evaluate
"TEST_DURING_TRAINING": True
"TEST_INTERVAL": 0.05 # as a fraction of updates, i.e. log every 5% of training process
"TEST_NUM_STEPS": 30
"TEST_NUM_ENVS": 512 # number of episodes to average over, can affect performance

"LOG_AGENTS_SEPARATELY": True # iql will log indipendent agents separately
